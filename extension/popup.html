<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Zashboard</title>
    <link
      rel="stylesheet"
      href="./popup.css"
    />
  </head>

  <body class="bg-base-200 text-base-content antialiased">
    <main class="max-h-[600px] overflow-hidden p-4">
      <header class="mb-4 flex items-center justify-between gap-3">
        <div class="flex min-w-0 items-center gap-3">
          <img
            class="size-10 rounded-xl shadow-sm"
            src="./icons/icon-192.png"
            alt=""
            aria-hidden="true"
          />

          <div class="min-w-0">
            <h1 class="m-0 text-base font-bold tracking-tight">Zashboard</h1>
            <p class="text-base-content/60 m-0 mt-0.5 text-xs">选择要连接的后端</p>
          </div>
        </div>

        <button
          id="manage-backends"
          class="btn btn-ghost btn-sm text-base-content/70 hover:text-base-content shrink-0 px-2.5"
          type="button"
          title="管理后端"
          aria-label="管理后端"
        >
          <svg
            class="size-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.12.37.34.72.6 1 .3.29.68.46 1.1.49H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"
            />
          </svg>
        </button>
      </header>

      <section
        id="backend-list"
        class="border-base-300 bg-base-100 max-h-[420px] overflow-x-hidden overflow-y-auto rounded-xl border"
        aria-label="后端列表"
        aria-live="polite"
      ></section>

      <p
        id="error-message"
        class="alert alert-error mt-3 hidden py-2 text-xs"
        role="alert"
      ></p>
    </main>

    <script
      src="./popup.js"
      defer
    ></script>
  </body>
</html>
